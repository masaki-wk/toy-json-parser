name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-format:
    runs-on: ubuntu-latest
    steps:
      - name: Install required tools
        run: rustup component add rustfmt
      - name: Show version information of tools
        run: |
          cargo --version
          cargo fmt --version
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify the format via Rustfmt
        run: cargo fmt --all --check --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install required tools
        run: rustup component add clippy
      - name: Show version information of tools
        run: |
          cargo --version
          cargo clippy --version
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint via Clippy
        run: cargo clippy --no-deps --all-targets --all-features -- --deny warnings

  verify-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Install required tools
        run: rustup component add rust-docs
      - name: Show version information of tools
        run: |
          cargo --version
          rustdoc --version
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the document
        run: cargo doc --no-deps --all-features

  test:
    name: Test with Rust-${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly, msrv]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve toolchain version
        id: resolve-toolchain-version
        shell: bash
        run: |
          case "${{ matrix.toolchain }}" in
            msrv)
              value=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
              echo "value=${value}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "value=${{ matrix.toolchain }}" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ steps.resolve-toolchain-version.outputs.value }}"
      - name: Show version information of tools
        run: |
          cargo --version
          rustc --version
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Test
        run: |
          cargo test --all-targets --all-features
          cargo test --doc
