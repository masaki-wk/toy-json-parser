name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-format:
    name: Verify format
    runs-on: ubuntu-latest
    steps:
      - name: Install required tools
        run: rustup component add rustfmt
      - name: Show version information of tools
        run: |
          cargo --version
          cargo fmt --version
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify the format via Rustfmt
        run: cargo fmt --all --check --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Install required tools
        run: rustup component add clippy
      - name: Show version information of tools
        run: |
          cargo --version
          cargo clippy --version
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint via Clippy
        run: cargo clippy --no-deps --all-targets --all-features -- --deny warnings

  verify-doc:
    name: Verify document
    runs-on: ubuntu-latest
    steps:
      - name: Install required tools
        run: |
          rustup component add rust-docs
          cargo install cargo-readme
      - name: Show version information of tools
        run: |
          cargo --version
          rustdoc --version
          cargo readme --version
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the document
        run: cargo doc --no-deps --all-features
      - name: Verify README.md
        run: |
          cargo readme | ./.github/tools/fix-readme.sh | cmp ./README.md -
          ./.github/tools/check-line-width.sh 80 ./README.md

  test:
    name: Test with Rust-${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly, msrv]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve toolchain version
        id: resolve-toolchain-version
        run: |
          case "${{ matrix.toolchain }}" in
            msrv)
              value=$(cargo metadata --format-version=1 --no-deps | jq --raw-output '.packages[0].rust_version')
              echo "value=${value}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "value=${{ matrix.toolchain }}" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ steps.resolve-toolchain-version.outputs.value }}"
      - name: Show version information of tools
        run: |
          cargo --version
          rustc --version
      - name: Build
        run: cargo build --all-targets --all-features
      - name: Test
        run: |
          cargo test --all-targets --all-features
          cargo test --doc
